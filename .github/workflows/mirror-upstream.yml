name: Mirror upstream main
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Marvisak/VIctory main to upstream-main
        run: |
          git init -q mirror && cd mirror
          git fetch -q https://github.com/Marvisak/VIctory.git main
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" FETCH_HEAD:refs/heads/upstream-main
